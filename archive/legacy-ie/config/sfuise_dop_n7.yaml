# SFUISE ISAS-Walk1 Configuration
# ISAS-Walk dataset: handheld walking with RTLS UWB + Waveshare Sense HAT IMU
# Ground truth: VIVE lighthouse tracker

dataset:
  interface: "sfuise"

sfuise:
  data_dir: "data/SFUISE"
  sequence: 1
  uwb_group_window: 0.0
  imu_topic: "/waveshare_sense_hat_b"
  uwb_topic: "/rtls_flares"
  anchor_topic: "/anchor_list"
  gt_topic: "/vive/transform/tracker_1_ref"

# Anchors auto-discovered from /anchor_list topic — no manual list needed
anchors: []

extrinsics:
  lever_arm_init: [0.1, -0.025, 0.0]   # UWB tag offset in IMU frame (SFUISE default)
  calib_lever: true
  lever_prior_sigma: 0.05

calibration:
  calib_anchor: false
  calib_range_bias: false
  range_bias_sigma: 0.05
  calib_td: false
  td_init: 0.0

# Waveshare Sense HAT (ICM-20948) — consumer-grade MEMS
# Noise params calibrated by SFUISE authors for this exact hardware
imu:
  sigma_a: 0.357       # accel noise (m/s^2) — 1/sqrt(7.85)
  sigma_g: 0.19        # gyro noise (rad/s) — 1/sqrt(27.6)
  sigma_wa: 0.044      # accel random walk (m/s^3) — 1/sqrt(515)
  sigma_wg: 0.018      # gyro random walk (rad/s^2) — 1/sqrt(2950)
  gravity: 9.81
  imu_acc_in_g: false  # SFUISE: acc in m/s² natively (acc_ratio=false)

initialization:
  use_imu_orientation: false
  imu_orientation_world: "enu"

# Decawave RTLS consumer UWB — ~0.15m noise typical
uwb:
  sigma_range: 0.15
  v_max: 2.0           # walking speed
  nlos_rssi_diff: 8.0  # fpp-rxp threshold for NLOS flag (RTLS-specific)
  min_range: 0.3
  max_range: 60.0
  dist_consistency_thresh: 2.0
  warmup_frames: 20

solver:
  lm_max_iter: 100
  rel_error_tol: 1.0e-6
  abs_error_tol: 1.0e-8
  gnc_mu_step: 1.4
  gnc_max_iter: 20
  gnc_rel_cost_tol: 1.0e-4
  gnc_inlier_prob: 0.99
  gnc_weight_thresh: -1.0
  chi2_reject_prob: 0.99
  max_rejection_rounds: 3

keyframe:
  step: 4               # UWB@16Hz → keyframe@4Hz (~229 keyframes)
  yaw_align_frames: 15

debug:
  log: false

# --- DoP-Optimized Synthetic Anchors (greedy PDOP minimization) ---
synthetic:
  enabled: true
  sigma_range: 0.12
  test_counts: [2]
  anchors:
    - id: 9000
      pos: [1.89, 0.47, 3.06]
      prior_sigma: 0.05
    - id: 9001
      pos: [2.69, -1.13, -0.51]
      prior_sigma: 0.05

# MILUV Circular with Synthetic Anchor Ablation
# Baseline: 6 real anchors, Δz=0.31m (all at ~1.7m). Tests: add 1-4
# synthetic anchors at diverse heights to measure accuracy improvement.

dataset:
  interface: "miluv"

miluv:
  data_dir: "../data/MILUV/default_1_circular3D_0"
  robot_dir: "ifo001"
  imu_csv: "imu_px4.csv"
  uwb_csv: "uwb_range.csv"
  gt_csv: "mocap.csv"
  uwb_group_window: 0.05
  tag_levers:
    10: [0.15, 0.0, 0.0]
    11: [-0.15, 0.0, 0.0]

anchors:
  - id: 0
    pos: [3.2738, 3.4640, 1.8093]
    prior_sigma: 0.10
  - id: 1
    pos: [3.1864, 0.2739, 1.5885]
    prior_sigma: 0.10
  - id: 2
    pos: [2.8505, -2.9231, 1.8974]
    prior_sigma: 0.10
  - id: 3
    pos: [-2.4976, -3.5018, 1.7731]
    prior_sigma: 0.10
  - id: 4
    pos: [-2.9579, 0.6128, 1.6571]
    prior_sigma: 0.10
  - id: 5
    pos: [-2.7347, 3.6585, 1.8903]
    prior_sigma: 0.10
extrinsics:
  lever_arm_init: [0.0, 0.0, 0.0]
  calib_lever: false
  lever_prior_sigma: 0.05

calibration:
  calib_anchor: false
  calib_range_bias: false
  range_bias_sigma: 0.10
  calib_td: false
  td_init: 0.0

imu:
  sigma_a: 0.002
  sigma_g: 0.0005
  sigma_wa: 0.0002
  sigma_wg: 4.0e-5
  gravity: 9.81
  imu_acc_in_g: false

initialization:
  use_imu_orientation: false
  imu_orientation_world: "enu"

uwb:
  sigma_range: 0.15
  v_max: 3.0
  nlos_rssi_diff: 6.0
  min_range: 0.3
  max_range: 30.0
  dist_consistency_thresh: 3.0
  warmup_frames: 30

solver:
  lm_max_iter: 200
  rel_error_tol: 1.0e-6
  abs_error_tol: 1.0e-8
  gnc_mu_step: 1.4
  gnc_max_iter: 100
  gnc_rel_cost_tol: 1.0e-5
  gnc_inlier_prob: 0.99
  gnc_weight_thresh: -1.0
  chi2_reject_prob: 0.99
  max_rejection_rounds: 3

keyframe:
  step: 3
  yaw_align_frames: 30

debug:
  log: false

# --- Synthetic Anchor Ablation ---
# Positions in anchor frame (same as real MILUV anchors).
# Arena ~7×7m, real anchors: all at z≈1.6-1.9m (Δz=0.31m).
# Synthetic anchors add ceiling (z=3.5m) and floor (z=0m) layers.
synthetic:
  enabled: true
  sigma_range: 0.15      # MILUV per-anchor median RMSE (tighter = less noisy synthetic)
  test_counts: [1, 2, 3, 4]
  anchors:
    - id: 9001
      pos: [0.0, 0.0, 3.5]      # center-ceiling → Δz becomes ~1.9m
      prior_sigma: 0.05
    - id: 9002
      pos: [0.0, 0.0, 0.0]      # center-floor → Δz becomes ~3.5m
      prior_sigma: 0.05
    - id: 9003
      pos: [4.0, 4.0, 3.5]      # corner-high
      prior_sigma: 0.05
    - id: 9004
      pos: [-4.0, -4.0, 0.0]    # corner-low
      prior_sigma: 0.05

# SFUISE ISAS-Walk1 with Synthetic Anchor Ablation
# Baseline: 5 real anchors, Δz=1.86m. Tests: add 1-4 synthetic anchors
# at geometrically-diverse positions to measure accuracy improvement.

dataset:
  interface: "sfuise"

sfuise:
  data_dir: "data/SFUISE"
  sequence: 1
  uwb_group_window: 0.0
  imu_topic: "/waveshare_sense_hat_b"
  uwb_topic: "/rtls_flares"
  anchor_topic: "/anchor_list"
  gt_topic: "/vive/transform/tracker_1_ref"

anchors: []

extrinsics:
  lever_arm_init: [0.1, -0.025, 0.0]
  calib_lever: true
  lever_prior_sigma: 0.05

calibration:
  calib_anchor: false
  calib_range_bias: false
  range_bias_sigma: 0.05
  calib_td: false
  td_init: 0.0

imu:
  sigma_a: 0.357
  sigma_g: 0.19
  sigma_wa: 0.044
  sigma_wg: 0.018
  gravity: 9.81
  imu_acc_in_g: false

initialization:
  use_imu_orientation: false
  imu_orientation_world: "enu"

uwb:
  sigma_range: 0.15
  v_max: 2.0
  nlos_rssi_diff: 8.0
  min_range: 0.3
  max_range: 60.0
  dist_consistency_thresh: 2.0
  warmup_frames: 20

solver:
  lm_max_iter: 100
  rel_error_tol: 1.0e-6
  abs_error_tol: 1.0e-8
  gnc_mu_step: 1.4
  gnc_max_iter: 20
  gnc_rel_cost_tol: 1.0e-4
  gnc_inlier_prob: 0.99
  gnc_weight_thresh: -1.0
  chi2_reject_prob: 0.99
  max_rejection_rounds: 3

keyframe:
  step: 4
  yaw_align_frames: 15

debug:
  log: false

# --- Synthetic Anchor Ablation ---
# Positions in anchor frame (same as real RTLS anchors).
# Room ~5.5×5.3m, real anchors: 3 at z≈0 + 2 at z≈1.86m.
# Synthetic anchors add height layers at z=3.0m and z=-0.5m.
synthetic:
  enabled: true
  sigma_range: 0.12      # SFUISE per-anchor median RMSE
  test_counts: [1, 2, 3, 4]
  anchors:
    - id: 8001
      pos: [2.75, 0.0, 3.0]     # center-high → Δz becomes 3.0m
      prior_sigma: 0.05
    - id: 8002
      pos: [2.75, 0.0, -0.5]    # center-low → Δz becomes 3.5m
      prior_sigma: 0.05
    - id: 8003
      pos: [-1.0, 0.0, 3.0]     # left-high → symmetric coverage
      prior_sigma: 0.05
    - id: 8004
      pos: [6.5, 0.0, -0.5]     # right-low → symmetric coverage
      prior_sigma: 0.05

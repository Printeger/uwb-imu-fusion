    11: [-0.17542, 0.15712, -0.05307]
  lever_source: MILUV_tags.yaml
anchors:
  0: [3.273827392578125, 3.46404736328125, 1.8093309326171875]
  1: [3.186386962890625, 0.27394485473632812, 1.5884853515625]
  2: [2.850500244140625, -2.923056884765625, 1.89742041015625]
  3: [-2.497634521484375, -3.5018203125, 1.7730911865234375]
  4: [-2.95793310546875, 0.6128419189453125, 1.65714208984375]
  5: [-2.734676513671875, 3.65854248046875, 1.890254638671875]
ground_truth: {file: ifo001/mocap.csv, reference: body, frame: vicon}
time: {source: csv_timestamp, offset_s: 0.0}
primary_tag: 10
bootstrap: {prefer_below_anchor_median: true, source: published_constellation_geometry}
supplemental_tags: [10, 11]
calibration: {policy: published_only, label: official_geometry}

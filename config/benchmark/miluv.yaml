  - {id: default_1_circular3D_0, path: default_1_circular3D_0}
  - {id: default_1_random3_0, path: default_1_random3_0, timing_representative: true}
imu: {file: ifo001/imu_px4.csv, acceleration_scale: 1.0, acceleration_unit: mps2, gyro_scale: 1.0, gyro_unit: radps, frame: px4_body}
uwb:

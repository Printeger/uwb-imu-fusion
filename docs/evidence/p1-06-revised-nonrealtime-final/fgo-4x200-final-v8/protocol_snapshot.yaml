schema: uwb-imu-pl/fde-profile-validation/v1
protocol_id: fde-profiles-20261006-revised-38x20-v1
description: >-
  Deterministic raw-stream validation for the five v6 FDE profiles.  The
  synthetic truth has 3-D translation, roll/pitch/yaw excitation and a
  non-zero body-to-UWB-tag lever arm.
input:
  imu_rate_hz: 200
  uwb_rate_hz: 20
  fixed_lag_epochs: 30
  integrity_window_epochs: 10
  recovery_margin_epochs: 10
  lever_arm_body_m: [0.25, -0.10, 0.08]
  imu_noise_interpretation: continuous_density_converted_to_discrete_by_sqrt_dt
  imu_discrete_accelerometer_sigma_mps2: 0.01
  imu_discrete_gyroscope_sigma_radps: 0.001
  uwb_noise_interpretation: per_measurement_standard_deviation
  nominal_physical_noise_fraction_of_integrity_overbound: 0.05
  nominal_gyro_noise_fraction_of_integrity_overbound: 0.01
  seeds: [20260901, 20260902, 20260903, 20260904, 20260905,
          20260906, 20260907, 20260908, 20260909, 20260910,
          20260911, 20260912, 20260913, 20260914, 20260915,
          20260916, 20260917, 20260918, 20260919, 20260920]
  monte_carlo_seeds: 20
profiles: ['off', uwb_order1, imu_order1, joint_order1, joint_order2]
active_profiles: [uwb_order1, imu_order1, joint_order1, joint_order2]
scenarios:
  fgo: [noiseless, nominal, initial_error, degenerate]
  profiles:
    'off': [nominal, uwb_fault, imu_accel_x, joint_fault, history_uwb, persistent_reject]
    uwb_order1: [nominal, uwb_fault, history_uwb, persistent_reject, uwb_recovery]
    imu_order1: [nominal, imu_accel_x, imu_accel_y, imu_accel_z, imu_gyro_x, imu_gyro_y, imu_gyro_z, imu_recovery]
    joint_order1: [nominal, uwb_fault, imu_accel_x, imu_gyro_z, joint_fault, history_uwb, persistent_reject, uwb_recovery, imu_recovery]
    joint_order2: [nominal, uwb_fault, imu_accel_x, imu_gyro_z, joint_fault, history_uwb, persistent_reject, joint_recovery, uwb_recovery, imu_recovery]
  pl:
    uwb_order1: [nominal, uwb_fault, uwb_recovery]
    imu_order1: [nominal, imu_accel_x, imu_gyro_z, imu_recovery]
    joint_order1: [nominal, uwb_fault, imu_accel_x, joint_fault, uwb_recovery, imu_recovery]
    joint_order2: [nominal, uwb_fault, imu_accel_x, joint_fault, joint_recovery, uwb_recovery, imu_recovery]
epochs:
  smoke: 30
  fgo: 200
  # User-authorized 2026-10-06 matrix reduction only.  The original 38x300
  # campaign is retained as historical evidence and is not claimed complete.
  behavior_original: 300
  behavior: 20
  pilot: 600
  sustained: 12000
  performance_full: 12000
profile_matrix:
  authorization_date: '2026-10-06'
  disposition: REVISED_SCOPE_38X20
  profile_scenario_runs: 38
  attempts_per_run: 20
  planned_attempts: 760
  original_campaign:
    profile_scenario_runs: 38
    attempts_per_run: 300
    planned_attempts: 11400
    status: SUPERSEDED_BY_USER_SCOPE_CHANGE/NOT_CLAIMED
    raw_evidence_policy: RETAIN_HISTORICAL_COMPLETE_AND_PARTIAL
  schedule:
    algorithm: proportional_thirds_min5_history_tail25_v1
    indexing: one_based_in_evidence_inclusive
    original_epochs: 300
    scaled_epochs: 20
    standard_interval:
      scenarios: [uwb_fault, imu_accel_x, imu_accel_y, imu_accel_z,
                  imu_gyro_x, imu_gyro_y, imu_gyro_z, joint_fault,
                  persistent_reject]
      original: {pre: 100, begin: 101, end: 200, fault: 100, post: 100}
      scaled: {pre: 6, begin: 7, end: 13, fault: 7, post: 7}
    historical_interval:
      scenarios: [history_uwb]
      original: {pre: 5, begin: 6, end: 276, fault: 271, post: 24}
      scaled: {pre: 5, begin: 6, end: 6, fault: 1, post: 14}
    recovery_impulse:
      scenarios: [uwb_recovery, imu_recovery, joint_recovery]
      original: {pre: 100, begin: 101, end: 101, fault: 1, post: 199}
      scaled: {pre: 6, begin: 7, end: 7, fault: 1, post: 13}
    no_fault:
      scenarios: [nominal]
      original: {normal: 300}
      scaled: {normal: 20}
performance:
  warmup_epochs: 100
  full_repeats: 3
  pilot_repeats: 1
  smoke_repeats: 1
  core_p99_ms_max: 40.0
  arrival_to_publish_p99_ms_max: 50.0
  deadline_miss_fraction_max: 0.01
  rss_peak_mib_max: 1024.0
acceptance_paths:
  contract_version: p1-06-revised-nonrealtime-goal-v2
  authorization_date: '2026-10-06'
  artifact_class: simulation/synthetic
  # The action census is an auditable consequence of the frozen detector
  # result: KEEP_ALL is the sole normal action; more than one generated action
  # means alarm/recovery analysis was entered.  Scenario labels are not used
  # to move individual attempts between denominators.
  classifier: complete_terminal_off_is_disabled_sole_keep_all_is_normal_else_alarm_or_unclassified
  normal:
    realtime_gate_disposition: FAILED_OR_PASS_REPORTED_DEFERRED_TO_REALTIME_GOAL
    core_p99_ms_max: 40.0
    arrival_to_publish_p99_ms_max: 50.0
    deadline_miss_fraction_max: 0.01
    complete_work_fraction_min: 1.0
  alarm_recovery:
    realtime_gate_disposition: FAILED_OR_PASS_REPORTED_DEFERRED_TO_REALTIME_GOAL
    complete_work_fraction_min: 1.0
    require_exact_leaf_partition: true
    require_protected_output_disabled: true
    require_atomic_terminal_packet: true
  all_attempts:
    complete_work_fraction_min: 1.0
    rss_peak_mib_max: 1024.0
    retain_all_timeouts_and_slow_attempts: true
    realtime_gate_blocks_revised_goal: false
  hardware_formal_qualification: CLOSED/NOT_CLAIMED
gates:

schema_version: uwb-imu-pl/v6
seed: 20260901
snapshot:
  dimensions: 3
  max_iterations: 30
  step_tolerance_m: 1.0e-07
  rank_tolerance: 1.0e-10
  max_condition_number: 1.0e10
incremental:
  relinearize_threshold: 0.1
  relinearize_skip: 1
  smoothness_sigma_m: 0.5
  epoch_bin_s: 0.02
  max_time_skew_s: 0.01
  enable_method_b: false
  method_b_max_condition: 1.0e10
  fixed_lag_epochs: 30
  single_transaction_per_epoch: true
imu:
  accelerometer_sigma: 0.0007071067811865475
  gyroscope_sigma: 7.071067811865475e-05
  accelerometer_bias_rw_sigma: 0.001
  gyroscope_bias_rw_sigma: 0.0001
  gravity_mps2: 9.80665
  max_gap_s: 0.02
  sigma_semantics: UNQUALIFIED_CONFIGURED_PARAMETER
  trapezoid_correlation_model: SHARED_SAMPLE_CORRELATION_UNQUALIFIED
  noise_overbound_calibration_id: ""
integrity_window:
  intervals: 10
  epochs: 10
  recovery_margin_epochs: 10
  boundary_method: bayes_tree_schur
  rank_tolerance: 1.0e-10
  max_condition_number: 1.0e10
  max_linearization_step_norm: 0.25
  require_history_provenance: true
history:
  max_summary_rows: 512
  max_fault_columns: 512
  max_perp_rows: 512
  capacity_action: REFUSE
detector:
  type: joint_window_residual_chi_square
  p_fa_per_test: 1.0e-06
  continuity_horizon_tests: 1000
  continuity_accounting: union_bound
  use_squared_norm_statistic: true
fault_models:
  max_cardinality: 2
  manifest_path: integrity_fault_manifest.yaml
  uwb:
    enabled: true
    epoch_single_anchor_bias: true
    persistent_anchor_bias: true
    ramp_bias: true
    prior_probability_bound: 0.0001
    p_md: 0.001
  imu:
    accel_axis_interval_bias: true
    gyro_axis_interval_bias: true
    accel_xyz_interval_bias: false
    gyro_xyz_interval_bias: false
    bias_jump: false
    ramp_fault: false
    accel_prior_probability_bound: 1.0e-05
    gyro_prior_probability_bound: 1.0e-05
    p_md: 0.001
    min_fault_gram_sigma: 1.0e-08
    max_fault_gram_condition: 1.0e10
  combinations:
    uwb_plus_accel: true
    uwb_plus_gyro: true
    two_uwb: false
    assume_independent_priors: false
fde:
  trigger: joint_detector_alarm_or_hardware_barrier
  isolation: profile_parity_glrt
  ambiguity_policy: union_exclusion_else_unavailable
  selection_primary: minimum_cardinality
  selection_secondary: minimum_protection_level
  dense_oracle_online_fallback: false
  max_candidate_count: 128
  max_exclusion_cardinality: 2
  profile: joint_order2
  on_no_valid_action: discard
  on_integrity_model_invalid: discard
bridge:
  generic:
    enabled: true
    model: constant_velocity_constant_attitude
    optimization_sigma_position_m: 0.5
    optimization_sigma_velocity_mps: 1.0
    optimization_sigma_rotation_rad: 0.5
    optimization_sigma_bias_accel: 0.01
    optimization_sigma_bias_gyro: 0.001
    acceleration_bound_mps2: 4.0
    angular_rate_bound_radps: 2.0
    angular_acceleration_bound_radps2: 4.0
    integrity_model: deterministic_box
    calibration_id: ""
  quadrotor_dynamics:
    enabled: false
    require_control_input: true
    model_calibration_id: ""
    integrity_model: deterministic_ellipsoid
  max_consecutive_epochs: 20
  max_duration_s: 1.0
health:
  suspect_evidence_count: 2
  quarantine_after_exclusion: true
  recovery_shadow_passes: 20
  recovery_test_passes: 10
  allow_auto_recovery: true
risk:
  calibration_id: ""
  p_hmi_total: 4.0e-05
  nominal_axis_tail: 1.0e-05
  p_nm: 1.0e-07
  p_bridge_escape: 0.0
  p_history_contamination: 0.0
  p_model_escape: 0.0
  horizontal_alert_limit_m: 2.0
  vertical_alert_limit_m: 3.0
  allocation_policy: prior_weighted_outcome_conditioned
robust_shadow:
  gnc_enabled: false
  never_mutate_formal_weights: true
output:
  root: results/fde_profiles/joint_order2
  schema_version: uwb-imu-pl/v6
  write_residuals: false
  write_timing: true
  write_global_diagnostics: false
  write_factor_ledger: true
  write_window_rows: false
  write_hypothesis_evidence: false
  write_candidates: false
  write_health: true
  write_bridge: true
realtime:
  world_frame: world
  body_frame: base_link
  imu_topic: /imu/data
  uwb_topic: /nlink_linktrack_nodeframe3
  odometry_topic: /uwb_imu_pl/odometry
  integrity_topic: /uwb_imu_pl/integrity
  diagnostics_topic: /diagnostics
  initial_position_m:
    - 0.0
    - 0.0
    - 0.0
  initial_velocity_mps:
    - 0.0
    - 0.0
    - 0.0
  lever_arm_body_m:
    - 0.25
    - -0.1
    - 0.08
  range_sigma_m: 0.1
  prior_sigmas:
    - 0.1
    - 0.1
    - 0.1
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    - 0.1
    - 0.1
    - 0.1
    - 0.01
    - 0.01
    - 0.01
  max_queued_events: 8192
  imu_overflow_policy: invalidate_and_reinitialize
  uwb_overflow_policy: drop_oldest_unprocessed_uwb
anchors:
  - id: 1
    position_m:
      - -5.0
      - -5.0
      - 1.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 2
    position_m:
      - -5.0
      - -5.0
      - 5.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 3
    position_m:
      - -5.0
      - 5.0
      - 1.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 4
    position_m:
      - -5.0
      - 5.0
      - 5.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 5
    position_m:
      - 5.0
      - -5.0
      - 1.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 6
    position_m:
      - 5.0
      - -5.0
      - 5.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 7
    position_m:
      - 5.0
      - 5.0
      - 1.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
  - id: 8
    position_m:
      - 5.0
      - 5.0
      - 5.0
    sigma_m: 0.05
    frame: world
    map_version: sim-v1
publication:
  allow_unprotected_output: true
  protected_output_enabled: false
  deadline_ms: 40.0

